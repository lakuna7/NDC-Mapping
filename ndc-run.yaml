name: NDC run

on:
  workflow_dispatch:
    inputs:
      ndc:
        description: "NDC input: labeler (0006), product (0006-0277) or package (0006-0277-31)"
        required: true
        type: string
      scripts:
        description: "Which scripts to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - source_matrix
          - geo_matrix
          - shortages
          - lookup
      include_wac:
        description: "Query California WAC (often 403 from cloud runners)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INPUT: ${{ inputs.ndc }}
      SCRIPTS: ${{ inputs.scripts }}
      INCLUDE_WAC: ${{ inputs.include_wac && '1' || '0' }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate input
        run: |
          if ! printf '%s' "$INPUT" | grep -Eq '^[0-9]{4,5}(-[0-9]{3,4}(-[0-9]{1,2})?)?$|^[0-9]{9}$|^[0-9]{11}$'; then
            echo "::error::Invalid NDC input: use 0006, 0006-0277, 0006-0277-31, 9 digits or 11 digits"
            exit 1
          fi

      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: local-data
          key: ndc-cache-${{ inputs.ndc }}-${{ github.run_id }}
          restore-keys: |
            ndc-cache-${{ inputs.ndc }}-

      - name: Run scripts
        working-directory: commands
        run: |
          set -euo pipefail
          run_script() {
            echo "::group::$1"
            bash "$1"
            echo "::endgroup::"
          }
          case "$SCRIPTS" in
            lookup)        run_script ndc_lookup.sh ;;
            source_matrix) run_script ndc_source_matrix.sh ;;
            geo_matrix)    run_script ndc_geo_matrix.sh ;;
            shortages)     run_script ndc_shortages.sh ;;
            all)
              run_script ndc_source_matrix.sh
              run_script ndc_geo_matrix.sh
              run_script ndc_shortages.sh
              run_script ndc_derived_kpis.sh
              ;;
          esac

      - name: Write run summary
        if: always()
        run: |
          python3 - <<'PY'
          import csv, glob, json, os
          out = []
          out.append("## NDC run: `" + os.environ["INPUT"] + "` (" + os.environ["SCRIPTS"] + ")")

          def table(path, cols, title, limit=25):
              with open(path, newline="", encoding="utf-8") as fh:
                  rows = list(csv.DictReader(fh))
              cols = [c for c in cols if rows and c in rows[0]]
              if not cols:
                  return
              out.append("")
              out.append("### " + title + " (" + str(len(rows)) + " rows, first " + str(min(limit, len(rows))) + ")")
              out.append("| " + " | ".join(cols) + " |")
              out.append("|" + "---|" * len(cols))
              for r in rows[:limit]:
                  out.append("| " + " | ".join((r.get(c) or "").replace("|", "/") for c in cols) + " |")

          for p in glob.glob("exports/tables/source_matrix_*/ndc11_source_matrix.csv"):
              table(p, ["ndc11_display", "brand_name", "sdud_count", "sdud_completeness",
                        "sdud_national_excluded", "nadac_per_unit", "nadac_eff_date",
                        "nadac_sort", "src_pb_ann_status"], "Source matrix checks")
          for p in glob.glob("exports/tables/shortages_*/ndc11_shortages.csv"):
              table(p, ["ndc11_display", "brand_name", "shortage_flag",
                        "shortage_status", "shortage_update_date"], "Shortages")
          for p in glob.glob("exports/tables/derived_kpis/ndc11_derived_kpis.csv"):
              table(p, ["ndc11", "kpi1_status", "kpi2_state_hhi", "kpi3_avg_units_per_rx",
                        "kpi4_status", "kpi5_coverage_ratio"], "Derived KPIs")
          for p in glob.glob("exports/logs/run_log_geo_*.json"):
              try:
                  w = json.load(open(p, encoding="utf-8")).get("warnings", [])
              except Exception:
                  w = ["could not read " + p]
              out.append("")
              out.append("### Geo warnings (" + str(len(w)) + ")")
              out.extend("- " + str(x) for x in w[:30])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(out) + "\n")
          PY

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndc-run-${{ github.run_number }}
          path: exports/
          retention-days: 30
          if-no-files-found: warn
